# OSV-Scanner findings that Halyx can't fix itself, each with the reason. They expire so they are looked at again.
# The Vulnerabilities workflow scans SBOMs of every published module (test scope included) and of the samples
# (runtime) with this file; see SECURITY.md.
#
# Spring Boot 3.5 line: the auto-configuration, the starter and the Spring Data module are built and tested against
# the versions Boot 3.5 manages, so they work in Boot 3.5 applications, and an application's own Boot BOM decides the
# versions it runs.

# Spring Framework 6.2, the Boot 3.5 line: in the auto-configuration's Boot 3.5 tests and the Boot 3.5 sample. Fixed
# only in Spring Framework 7 (Boot 4); a Boot 3.5 application's Boot BOM decides.

[[IgnoredVulns]]
