apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  application.yml: |
    {{- .Values.config | default "{}" | nindent 4 }}
  {{- range $name, $content := .Values.files }}
  {{ $name }}: |
    {{- $content | nindent 4 }}
  {{- end }}
