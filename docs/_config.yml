# GitHub Pages site for Halyx: Settings → Pages → "Deploy from a branch", folder /docs.
# Published at https://kamranzafar.github.io/halyx

title: Halyx
description: "Halyx: one Java API for storage, NoSQL, messaging, streams, SQL, caches and secrets on AWS, Azure and Google Cloud — a portable library over the clouds' own SDKs."
lang: en-US
url: "https://kamranzafar.github.io"
baseurl: "/halyx"

remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins:
  - jekyll-remote-theme
  - jekyll-relative-links
  - jekyll-seo-tag

relative_links:
  enabled: true
  collections: false

color_scheme: dark
search_enabled: true
search:
  heading_level: 3
  previews: 2
  preview_words_before: 4
  preview_words_after: 8
  tokenizer_separator: /[\s/]+/
  button: true

aux_links:
  "GitHub":
    - "https://github.com/kamranzafar/halyx"
aux_links_new_tab: true

heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"
enable_copy_code_button: true

callouts:
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green
  important:
    title: Important
    color: purple
  warning:
    title: Warning
    color: red

footer_content: >-
  Copyright 2026 Kamran Zafar. Halyx is distributed under the
  <a href="https://www.apache.org/licenses/LICENSE-2.0">Apache License 2.0</a>.

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
