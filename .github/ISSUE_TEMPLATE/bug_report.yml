name: Bug report
description: Something in Halyx doesn't work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. For questions, use [Discussions](https://github.com/halyx-dev/halyx/discussions),
        and report security problems privately, as the [security policy](https://github.com/halyx-dev/halyx/blob/main/SECURITY.md) says.
  - type: input
    id: version
    attributes:
      label: Halyx version
      placeholder: 1.0.0
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      multiple: true
      options: [AWS, Azure, Google Cloud, HashiCorp Vault, In-memory, Other]
    validations:
      required: true
  - type: dropdown
    id: service
    attributes:
      label: Service
      multiple: true
      options:
        - Object storage (BlobStore)
        - NoSQL documents (DocumentStore, repositories)
        - Messaging (Publisher, Subscription)
        - Events (EventPublisher)
        - Streams (StreamProducer, StreamConsumer)
        - SQL databases (Database, R2DBC)
        - Caches (Cache)
        - Parameters and secrets (ParameterStore)
        - Spring Boot starter
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what happened instead. Include the exception and stack trace if there is one.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce it
      description: The code, configuration or steps that show the problem. A failing test is ideal.
      render: java
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Java version, Spring Boot version if you use it, and whether this is on a real cloud or an emulator.
