name: Feature request
description: Something Halyx could do, on one cloud or all of them
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Check the [roadmap](https://halyx.dev/docs/roadmap.html) first: the feature may already be planned.
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The problem or use case, rather than the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like Halyx to do
      description: An API sketch or configuration example helps.
  - type: textarea
    id: clouds
    attributes:
      label: Clouds
      description: Which clouds need it, and how each cloud's service supports it, if you know.
  - type: textarea
    id: today
    attributes:
      label: What you do today
      description: Any workaround, such as unwrap and the native SDK client.
