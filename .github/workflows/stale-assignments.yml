# Daily: reminds contributors assigned to an issue without a linked pull request after 7 days, and unassigns them
# after 10. Run it by hand with dry-run to see what it would do.
name: Stale assignments

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: Only log what would happen
        type: boolean
        default: true

concurrency:
  group: stale-assignments

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/github-script@v7
        env:
          DRY_RUN: ${{ inputs.dry-run }}
        with:
          script: |
            const check = require('./.github/scripts/stale-assignments.js');
            await check({ github, context, core, dryRun: process.env.DRY_RUN === 'true' });
