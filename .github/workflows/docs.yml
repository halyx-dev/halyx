# Asks halyx-dev/halyx.dev to rebuild and deploy https://halyx.dev when the docs change on main. The site also
# shows the newest release tag as the version, so pushing a vX.Y.Z tag triggers it too.
#
# Secrets:
#   HALYX_DEV_DISPATCH_TOKEN   fine-grained token on halyx-dev/halyx.dev only, Contents: read and write
#                              (the permission repository_dispatch needs)
name: Docs

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - docs/**
  workflow_dispatch:

permissions: {}

jobs:
  dispatch:
    name: Trigger the halyx.dev deploy
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.HALYX_DEV_DISPATCH_TOKEN }}
        run: gh api repos/halyx-dev/halyx.dev/dispatches -f event_type=docs-updated
