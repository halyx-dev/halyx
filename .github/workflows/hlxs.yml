# Runs the published HLXS v1 test vectors through the independent Python decoder, so the format's specification stays
# complete without Halyx's Java code. The Java side runs the same vectors in HlxsVectorsTest.
name: HLXS format

on:
  push:
    branches: [main, '[0-9]+.[0-9]+.x']
    paths:
      - 'docs/api/keys-format.md'
      - 'halyx-core/src/main/java/dev/halyx/keys/**'
      - 'halyx-core/src/test/resources/hlxs/**'
      - 'tools/hlxs-python/**'
      - '.github/workflows/hlxs.yml'
  pull_request:
    paths:
      - 'docs/api/keys-format.md'
      - 'halyx-core/src/main/java/dev/halyx/keys/**'
      - 'halyx-core/src/test/resources/hlxs/**'
      - 'tools/hlxs-python/**'
      - '.github/workflows/hlxs.yml'
  workflow_dispatch:

concurrency:
  group: hlxs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  python-decoder:
    name: Independent decoder (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the decoder's dependency
        run: pip install -r tools/hlxs-python/requirements.txt
      - name: Run the test vectors
        working-directory: tools/hlxs-python
        run: python -m unittest -v test_vectors
