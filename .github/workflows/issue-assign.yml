# Assigns an issue to a contributor who asks for it ("/assign", or "can I work on this?"), following the rules in
# .github/scripts/issue-assign.js. Maintainers' comments and pull request comments are ignored.
name: Issue assignment

on:
  issue_comment:
    types: [created]

concurrency:
  group: issue-assign-${{ github.event.issue.number }}

permissions:
  contents: read
  issues: write

jobs:
  assign:
    if: >-
      !github.event.issue.pull_request
      && github.event.comment.user.type != 'Bot'
      && !contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/github-script@v7
        with:
          script: |
            const assign = require('./.github/scripts/issue-assign.js');
            await assign({ github, context, core });
