<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <radialGradient id="glow" cx="0.78" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#1d4ed8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#1d4ed8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.08" cy="0.95" r="0.5">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="headline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" opacity="0.05"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1280" height="640" fill="#0b1120"/>
  <rect width="1280" height="640" fill="url(#dots)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <rect width="1280" height="640" fill="url(#glow2)"/>

  <!-- brand -->
  <g transform="translate(80,84)">
    <rect width="56" height="56" rx="14" fill="url(#mark)"/>
    <g fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round">
      <path d="M17 12 C 17 26, 39 30, 39 44"/>
      <path d="M39 12 C 39 26, 17 30, 17 44" opacity="0.6"/>
      <path d="M20 21 H36 M20 35 H36" stroke-width="3" opacity="0.85"/>
    </g>
    <text x="74" y="40" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="36" font-weight="700" fill="#f8fafc" letter-spacing="0.5">Halyx</text>
  </g>

  <!-- headline -->
  <text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="700" font-size="60" fill="#f8fafc" letter-spacing="-1">
    <tspan x="80" y="252">One Java API</tspan>
    <tspan x="80" y="324" fill="url(#headline)">for every cloud.</tspan>
  </text>
  <text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" fill="#94a3b8">
    <tspan x="80" y="380">Storage, NoSQL, messaging, Kafka, SQL, caches</tspan>
    <tspan x="80" y="412">and secrets, with the same behaviour on each.</tspan>
  </text>

  <!-- cloud chips -->
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#e2e8f0">
    <rect x="80" y="450" width="92" height="42" rx="21" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
    <circle cx="102" cy="471" r="5" fill="#f59e0b"/>
    <text x="116" y="478">AWS</text>
    <rect x="184" y="450" width="104" height="42" rx="21" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
    <circle cx="206" cy="471" r="5" fill="#3b82f6"/>
    <text x="220" y="478">Azure</text>
    <rect x="300" y="450" width="170" height="42" rx="21" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
    <circle cx="322" cy="471" r="5" fill="#22c55e"/>
    <text x="336" y="478">Google Cloud</text>
  </g>

  <!-- footer -->
  <text x="80" y="566" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#64748b">
    halyx.dev  <tspan fill="#334155">·</tspan>  Spring Boot 3.5 &amp; 4  <tspan fill="#334155">·</tspan>  Maven Central  <tspan fill="#334155">·</tspan>  Apache-2.0
  </text>

  <!-- code window -->
  <g transform="translate(668,118)" filter="url(#shadow)">
    <rect width="532" height="404" rx="16" fill="#111a2e" stroke="#ffffff" stroke-opacity="0.10"/>
    <path d="M0 16 a16 16 0 0 1 16 -16 h500 a16 16 0 0 1 16 16 v28 h-532z" fill="#0f172a"/>
    <circle cx="26" cy="22" r="6" fill="#ef4444" opacity="0.85"/>
    <circle cx="46" cy="22" r="6" fill="#f59e0b" opacity="0.85"/>
    <circle cx="66" cy="22" r="6" fill="#22c55e" opacity="0.85"/>
    <text x="266" y="28" text-anchor="middle" font-family="Menlo, monospace" font-size="14" fill="#64748b">InvoiceService.java</text>
    <line x1="0" y1="44" x2="532" y2="44" stroke="#ffffff" stroke-opacity="0.08"/>

    <g font-family="Menlo, monospace" font-size="17" fill="#cbd5e1" xml:space="preserve">
      <text x="28" y="88"><tspan fill="#7dd3fc">BlobStore</tspan> invoices = halyx</text>
      <text x="28" y="116">    .<tspan fill="#c4b5fd">provider</tspan>(<tspan fill="#86efac">"cloud"</tspan>)</text>
      <text x="28" y="144">    .<tspan fill="#c4b5fd">blobStore</tspan>(<tspan fill="#86efac">"invoices"</tspan>);</text>
      <text x="28" y="186">invoices.<tspan fill="#c4b5fd">put</tspan>(key, content);</text>
      <text x="28" y="214"><tspan fill="#64748b">// S3, Blob Storage or Cloud Storage</tspan></text>
    </g>

    <!-- config strip -->
    <rect x="20" y="246" width="492" height="136" rx="10" fill="#0b1222" stroke="#ffffff" stroke-opacity="0.06"/>
    <text x="36" y="272" font-family="Menlo, monospace" font-size="13" fill="#64748b">application.yml</text>
    <g font-family="Menlo, monospace" font-size="17" fill="#cbd5e1" xml:space="preserve">
      <text x="36" y="306"><tspan fill="#7dd3fc">halyx.providers.cloud.type</tspan>:</text>
    </g>
    <g font-family="Menlo, monospace" font-size="16" font-weight="700">
      <rect x="36" y="324" width="74" height="36" rx="8" fill="#f59e0b" fill-opacity="0.16" stroke="#f59e0b" stroke-opacity="0.6"/>
      <text x="73" y="348" text-anchor="middle" fill="#fcd34d">aws</text>
      <rect x="122" y="324" width="96" height="36" rx="8" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6" stroke-opacity="0.6"/>
      <text x="170" y="348" text-anchor="middle" fill="#93c5fd">azure</text>
      <rect x="230" y="324" width="74" height="36" rx="8" fill="#22c55e" fill-opacity="0.16" stroke="#22c55e" stroke-opacity="0.6"/>
      <text x="267" y="348" text-anchor="middle" fill="#86efac">gcp</text>
      <text x="322" y="348" font-weight="400" font-size="15" fill="#64748b">same code</text>
    </g>
  </g>
</svg>
