# The custom role the test service account needs on the keys the key store kit rotates or disables: tck-data,
# tck-disposable, tck-rsa, tck-rsa-pss, tck-p256 and tck-p384. Destroying versions is for pruning the versions the
# kit's rotations leave behind, each billed while it's enabled or disabled. Created outside Terraform, with the test
# service account's other roles (see docs/cloud-testing/gcp.md):
#
#   gcloud iam roles create halyxTestKeyRotation --project <project> \
#       --file cloud-testing/infra/gcp/keys/test-key-rotation-role.yml
title: Halyx test key rotation
description: Rotating, disabling and enabling the Halyx real-cloud test keys (cloud-testing/infra/gcp/keys)
stage: GA
includedPermissions:
  - cloudkms.cryptoKeys.get
  - cloudkms.cryptoKeys.update
  - cloudkms.cryptoKeyVersions.create
  - cloudkms.cryptoKeyVersions.get
  - cloudkms.cryptoKeyVersions.list
  - cloudkms.cryptoKeyVersions.update
  - cloudkms.cryptoKeyVersions.destroy
